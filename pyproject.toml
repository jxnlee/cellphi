[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cellphi"
version = "0.3.0"
description = "Organoid segmentation (Cellpose) and diameter measurement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cellpose>=4.0,<5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "tifffile",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cellphi = "cellphi.cli:main"

[tool.setuptools]
packages = ["cellphi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs Cellpose on real images (run with: pytest -m slow)"]
addopts = "-m 'not slow'"
