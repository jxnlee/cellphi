name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Fast tests only. Tests that run the Cellpose model are marked "slow" and are skipped here
    # (no GPU on GitHub runners); run them locally with tools/check_before_push.sh.
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (without Cellpose/PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Fast tests
        run: pytest -q
      - name: Command-line tool starts
        run: cellphi --help
